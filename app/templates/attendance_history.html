{% extends 'base.html' %}
{% block title %}Historial de asistencia - MarcajeTPV{% endblock %}
{% block page_title %}Historial de asistencia{% endblock %}
{% block content %}<div class="attendance-page"><section class="card attendance-history-card"><div class="attendance-filter-bar"><input id="historyFrom" type="date" class="form-control"><input id="historyTo" type="date" class="form-control"><input id="historyEmployee" class="form-control" placeholder="Empleado o cédula"><button id="historySearch" class="btn-ios primary" type="button">Buscar</button></div><div class="table-responsive"><table class="table ios-table align-middle"><thead><tr><th>Empleado</th><th>Fecha y hora</th><th>Tipo</th><th>Origen</th><th>Estado</th></tr></thead><tbody id="attendanceHistoryRows"></tbody></table></div><div class="attendance-pagination"><button id="historyPrev" class="btn-ios ghost" type="button">Anterior</button><span id="historyPage">Página 1</span><button id="historyNext" class="btn-ios ghost" type="button">Siguiente</button></div></section></div>{% endblock %}
{% block scripts %}<script>document.addEventListener('DOMContentLoaded',()=>{let page=1;const load=async()=>{const params=new URLSearchParams({page:String(page),page_size:'25'});const from=document.getElementById('historyFrom').value;const to=document.getElementById('historyTo').value;const employee=document.getElementById('historyEmployee').value.trim();if(from)params.set('date_from',from);if(to)params.set('date_to',to);const data=await(await fetch(`/api/attendance/history?${params}`)).json();document.getElementById('attendanceHistoryRows').innerHTML=data.items.map(item=>`<tr><td><strong>${item.empleado_nombre}</strong><small>${item.cedula}</small></td><td>${new Date(item.fecha_hora).toLocaleString()}</td><td><span class="attendance-type attendance-type--${item.tipo.toLowerCase()}">${item.tipo}</span></td><td>${item.origen}</td><td>Registrado</td></tr>`).join('')||'<tr><td colspan="5">Sin marcajes para los filtros seleccionados.</td></tr>';document.getElementById('historyPage').textContent=`Página ${data.page}`;document.getElementById('historyPrev').disabled=page<=1;document.getElementById('historyNext').disabled=page*data.page_size>=data.total};document.getElementById('historySearch').onclick=()=>{page=1;load()};document.getElementById('historyPrev').onclick=()=>{if(page>1){page--;load()}};document.getElementById('historyNext').onclick=()=>{page++;load()};load()});</script>{% endblock %}
