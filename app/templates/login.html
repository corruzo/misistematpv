<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión - MarcajeTPV</title><link rel="stylesheet" href="/static/css/style.css?v=1.0"></head>
<body class="ios-bg auth-page"><main class="auth-card"><div class="brand-mark">MTPV</div><p class="eyebrow">MarcajeTPV</p><h1>Iniciar sesión</h1><p class="auth-subtitle">Accede a tu panel de gestión.</p>{% if error %}<div class="auth-error" role="alert">{{ error }}</div>{% endif %}<form method="post" action="/login" class="auth-form"><label class="form-label" for="username">Usuario</label><input class="form-control" id="username" name="username" autocomplete="username" required autofocus><label class="form-label" for="password">Contraseña</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required><button class="btn-ios primary" type="submit">Entrar</button></form><a class="auth-link" href="/setup">Configurar primer administrador</a></main></body></html>
