name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile application
        run: python -m compileall -q app run.py
      - name: Run portable tests with coverage
        run: >-
          python -m pytest
          tests/test_api_authorization.py
          tests/test_attendance_service.py
          tests/test_auth_service.py
          tests/test_csrf_and_rate_limit.py
          tests/test_employees_page.py
          tests/test_security_contracts.py
          --cov=app --cov-report=term-missing --cov-report=xml